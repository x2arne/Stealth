<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get key — Stealth X</title>
<meta name="description" content="Ambil key gratis atau cek status key kamu.">
<link rel="icon" type="image/png" href="/assets/Arc.png?v=2">
<link rel="apple-touch-icon" href="/assets/Arc.png?v=2">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
.hero{padding:72px 0 28px}.hero h1{font-size:clamp(3.2rem,11vw,6.5rem);line-height:1;letter-spacing:-.045em;font-weight:800}
.hero .subtitle{max-width:52ch;margin:18px 0 28px}
.field{width:100%;background:var(--field);border:1px solid var(--border-strong);color:var(--text);padding:12px 14px;border-radius:var(--radius-s);font:inherit}
.field:focus{outline:2px solid var(--accent);outline-offset:2px}
.keybox{padding:18px;font:600 1.1rem ui-monospace,Menlo,monospace;word-break:break-all;color:var(--accent-light)}
.plan{display:flex;flex-direction:column;gap:12px}.plan .price{font-size:2rem;font-weight:800}.plan ul{padding-left:18px;color:var(--text-2)}
.msg{margin-top:12px;color:var(--text-2)}.msg.err{color:var(--danger)}.msg.ok{color:var(--success)}
</style>
</head>
<body>
<nav class="topnav">
  <div class="topnav-inner">
    <a class="brand" href="/" aria-label="Stealth X home"><img src="/assets/Arc.png?v=2" alt=""><span>Stealth X</span></a>
    <div class="topnav-links" aria-label="Primary navigation">
      <a href="/script">Script</a>
      <a href="/get-key" class="active" aria-current="page">Get key</a>
      <a href="/pricing">Pricing</a>
      <a href="/docs">Docs</a>
      <a href="https://discord.gg/XXXXXXXXXX" target="_blank" rel="noopener noreferrer" class="discord-link">Discord</a>
    </div>
  </div>
</nav>
<main class="wrap">

  <header class="header"><div>
    <div class="page-kicker"><span class="status-dot"></span> Key system</div>
    <h1>Get key</h1>
    <p class="subtitle">Key gratis aktif 24 jam dan terkunci ke 1 perangkat (HWID). Mau tanpa batas? Lihat <a href="/pricing" style="text-decoration:underline">Premium</a>.</p>
  </div></header>
  <section class="terminal glass" style="margin-bottom:24px">
    <div class="terminal-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="terminal-title">Free key</span></div>
    <div class="keybox" id="key" hidden></div>
    <div style="padding:18px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn accent big" id="gen">Generate key</button>
      <button class="btn ghost big" id="copy" hidden>Copy key</button>
    </div>
    <p class="msg" id="msg" style="padding:0 18px 18px"></p>
  </section>
  <section class="feature-card glass" style="max-width:none">
    <h3>Cek status key</h3>
    <form id="chk" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
      <input class="field" id="k" placeholder="SX-XXXX-XXXX-XXXX" style="flex:1;min-width:220px" autocomplete="off">
      <button class="btn ghost big">Cek</button>
    </form>
    <p class="msg" id="cmsg"></p>
  </section>
  <footer class="footer"><div class="footer-content"><span class="footer-brand">Stealth X</span><a href="/script">Script</a><a href="/script/games">Games</a><a href="/script/statistics">Stats</a><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/about">About</a></div></footer>
</main>

<script>
const $=i=>document.getElementById(i);
$('gen').onclick=async()=>{
  $('gen').disabled=true;$('msg').className='msg';$('msg').textContent='';
  const r=await fetch('/api/key',{method:'POST'});const d=await r.json();
  $('gen').disabled=false;
  if(d.ok){$('key').hidden=false;$('key').textContent=d.key;$('copy').hidden=false;$('msg').className='msg ok';$('msg').textContent='Key dibuat. Pakai di loader: script_key = "'+d.key+'"';}
  else{$('msg').className='msg err';$('msg').textContent=d.error||'Gagal membuat key';}
};
$('copy').onclick=()=>navigator.clipboard.writeText($('key').textContent).then(()=>$('copy').textContent='Copied');
$('chk').onsubmit=async e=>{e.preventDefault();
  const r=await fetch('/api/validate?key='+encodeURIComponent($('k').value.trim()));const d=await r.json();
  $('cmsg').className='msg '+(d.ok?'ok':'err');
  $('cmsg').textContent=d.ok?('Valid ('+d.tier+')'+(d.expires?' sampai '+new Date(d.expires).toLocaleString('id-ID'):' tanpa batas waktu')):({KEY_INVALID:'Key tidak ditemukan',KEY_EXPIRED:'Key kedaluwarsa',KEY_BLACKLISTED:'Key diblacklist',KEY_HWID_LOCKED:'HWID tidak cocok'}[d.code]||d.code);
};
</script>
</body>
</html>
